[project]
name = "voz-raid"
version = "0.1.0"
description = "Ponte de voz: push-to-talk -> Whisper -> ordem 'ab ...' -> raid chat dos bots (via console do worldserver)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = ["piper-tts"]

[tool.uv]
package = false
