[project]
name = "wow-ml-pvp"
version = "0.1.0"
description = "Política ML para playerbots PvP (ver ../BRIEF-IA-PVP.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy",
    "polars",
    "pyarrow",
    "gymnasium",
    "onnx",
    "onnxruntime",
    "tensorboard",
    "pyzmq",
    "msgpack",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
